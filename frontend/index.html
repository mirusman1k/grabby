<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grabby</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <h1>Grabby</h1>
      <button id="reveal" class="ghost" type="button">Open folder</button>
    </header>

    <form id="lookup" autocomplete="off">
      <input id="url" type="url" placeholder="Paste a video or playlist link" required spellcheck="false">
      <button type="submit" id="lookupBtn">Fetch</button>
    </form>

    <p id="error" class="error" hidden></p>

    <section id="result" hidden>
      <!-- single video -->
      <div id="videoCard" class="card" hidden>
        <img id="thumb" alt="">
        <div class="meta">
          <h2 id="title"></h2>
          <p id="submeta"></p>
        </div>
      </div>

      <!-- playlist -->
      <div id="playlistCard" class="card column" hidden>
        <div class="pl-head">
          <h2 id="plTitle"></h2>
          <p id="plMeta"></p>
        </div>
        <div class="pl-actions">
          <button type="button" class="ghost" id="selAll">Select all</button>
          <button type="button" class="ghost" id="selNone">Clear</button>
          <span id="selCount"></span>
        </div>
        <ul id="entries"></ul>
      </div>

      <!-- shared controls -->
      <div class="controls">
        <label>
          Quality
          <select id="quality"></select>
        </label>
        <label class="check">
          <input type="checkbox" id="audioOnly">
          Audio only (mp3)
        </label>
        <label class="check" id="maxQualityLabel" title="Allows 1440p and 4K, but the file will need VLC or IINA - QuickTime cannot play VP9/AV1.">
          <input type="checkbox" id="maxQuality">
          Max quality (needs VLC)
        </label>
        <button type="button" id="downloadBtn">Download</button>
      </div>
    </section>

    <section id="jobsWrap" hidden>
      <h3>Downloads</h3>
      <ul id="jobs"></ul>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
